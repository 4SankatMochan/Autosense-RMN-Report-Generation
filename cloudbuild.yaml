steps:
    # Step 1: Deploy to Cloud Run with updated .env vars
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Deploying Cloud Run service using .env..."
        gcloud run deploy rmn-agent-report \
          --source . \
          --project acn-cda \
          --region us-central1 \
          --env-vars-file .env

   # Step 2: Pull the image from the source repo
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-source-image'
    args:
      - 'pull'
      - 'us-central1-docker.pkg.dev/acn-cda/cloud-run-source-deploy/rmn-agent-report:latest'

  # Step 3: Tag the image for the destination repo
  - name: 'gcr.io/cloud-builders/docker'
    id: 'tag-destination-image'
    args:
      - 'tag'
      - 'us-central1-docker.pkg.dev/acn-cda/cloud-run-source-deploy/rmn-agent-report:latest'
      - 'us-central1-docker.pkg.dev/acn-cda/rmn-agent-repo/rmn-agent-image-report:latest'

  # Step 4: Push the image to the destination repo
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-destination-image'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/acn-cda/rmn-agent-repo/rmn-agent-image-report:latest'
