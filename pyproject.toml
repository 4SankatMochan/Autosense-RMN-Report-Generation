[project]
name = "data-science"
version = "0.1"
description = "Data Science and Data QnA Multi-Agent"
authors = [
    {name = "Meltem Subasioglu", email = "msubasioglu@google.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
    "immutabledict>=4.2.1",
    "sqlglot>=26.10.1",
    "db-dtypes>=1.4.2",
    "regex>=2024.11.6",
    "tabulate>=0.9.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.27.1",
    "absl-py>=2.2.2",
    "pydantic>=2.11.3",
    "env>=0.1.0",
    "google-generativeai>=0.8.5",
    "gradio>=5.35.0",
    "google-cloud-bigquery>=3.34.0",
    "pandas>=2.3.0",
    "numpy>=2.3.1",
    "matplotlib>=3.5.0",
    "openpyxl>=3.1.0",
    "gcsfs>=2025.5.1",
    "reportlab>=4.4.4",
    "markdown-to-json>=2.1.2",
]

[project.optional-dependencies]
dev = [
    "google-cloud-aiplatform[adk,agent-engines,evaluation]>=1.27.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ipykernel>=7.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
console_output_style = "progress"
addopts = "-vv -s"
testpaths = ["tests/"]
log_level = "DEBUG"
log_cli = true
log_auto_indent = true
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_format = "[%(asctime)s] %(levelname)s (%(funcName)s) \t [%(pathname)s:%(lineno)d] %(message)s"
filterwarnings = [
    "ignore::UserWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"